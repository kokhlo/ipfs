name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce alire.toml version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(awk -F'"' '/^version *=/{print $2}' alire.toml)
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag v$TAG does not match alire.toml version $MANIFEST_VERSION"
            exit 1
          fi
          echo "Version check passed: $MANIFEST_VERSION"

      - uses: alire-project/setup-alire@v5
        with:
          toolchain: gnat_native=16.1.0 gprbuild=26.0.1

      - name: Expose Alire toolchain binaries on PATH
        run: |
          if ! command -v gprbuild >/dev/null 2>&1; then
            for d in "$HOME"/.local/share/alire/toolchains/*/bin; do
              echo "$d" >> "$GITHUB_PATH"
            done
          fi

      - name: Build library and tests
        run: |
          gprbuild -p -P ipfs.gpr
          gprbuild -p -P ipfs_tests.gpr

      - name: Run test suites
        run: ./bin/ipfs_tests_runner

      - name: Create source archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --prefix="ipfs-$VERSION/" -o "ipfs-$VERSION.tar.gz" "$GITHUB_SHA"
          shasum -a 512 "ipfs-$VERSION.tar.gz" > "ipfs-$VERSION.tar.gz.sha512"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ipfs-*.tar.gz
            ipfs-*.tar.gz.sha512
